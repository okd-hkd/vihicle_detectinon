":"Photos of the grey Volkswagen Jetta car recently began circulating on social media, drawing attention because the custom number plate clearly referred to a six-word profanity."}]},{"type":"p","children":[{"type":"text","data":"Traffic police in Mentougou district found and arrested the suspect, surnamed Wei, at his home in the neighbourhood on Tuesday after identifying him through CCTV footage, "},{"type":"em","children":[{"type":"text","data":"Sohu Police News"}]},{"type":"text","data":" reported the next day."}]},{"type":"p","children":[{"type":"a","attribs":{"href":"http://www.scmp.com/news/china/society/article/2111989/chinas-most-beautiful-library-ordered-shut-over-claims-it","title":"www.scmp.com"},"children":[{"type":"text","data":"China’s ‘most beautiful’ library ordered to shut over claims it provided pirated material and obscene content"}]}]},{"type":"p","children":[{"type":"text","data":"Photos released by police show them arresting him and confiscating the offending car."}]},{"type":"ad"},{"type":"p","children":[{"type":"text","data":"The custom licence plate had six Latin alphabet characters instead of the usual three letters and number combination found on standard Beijing car licence plates."}]},{"type":"p","children":[{"type":"img","attribs":{"title":"Police found that the driver had doctored his original number plate. Photo: Handout","width":"660","height":"385","data-resolution":"2","src":"https://cdn4.i-scmp.com/sites/default/files/images/methode/2017/09/28/cad018a4-a3ed-11e7-84b5-dfc1701cb40c_1320x770_152223.JPG","class":"caption"},"children":[]}]},{"type":"p","children":[{"type":"text","data":"The letters CNMLGB could be taken to refer to a phrase that translates roughly as “f*** your mother’s ****”. Police found that Wei had fixed the fake number plate on top of his car’s original number plate using screws."}]},{"type":"outstream-1"},{"type":"p","children":[{"type":"text","data":"Wei has been sentenced to 15 days in prison and was fined 15,0
